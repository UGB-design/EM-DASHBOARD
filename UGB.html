<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Umesh Bolmal &amp; Associates — Staff Portal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&display=swap");
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:"Google Sans",Roboto,sans-serif;background:#f0f4fa;overflow:hidden}

/* ── Loader ─────────────────────────────────────────────────── */
#loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px}
.logo{font-size:11px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:#1F5FA6}
.bar-wrap{width:200px;height:3px;background:#dce8f7;border-radius:4px;overflow:hidden}
.bar{height:100%;width:35%;background:#1F5FA6;border-radius:4px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}
.msg{font-size:11px;color:#6b8ab0;letter-spacing:1.5px;text-transform:uppercase}
.err{text-align:center;color:#e53e3e;font-size:13px}
.retry{margin-top:12px;padding:8px 20px;background:#1F5FA6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px}

/* ── Sign-in / Denied gates ────────────────────────────────────── */
.auth-screen,.denied-screen{position:fixed;inset:0;background:#f0f4fa;display:none;align-items:center;justify-content:center;z-index:9999}
.auth-screen.show,.denied-screen.show{display:flex}
.auth-box,.denied-box{background:#fff;border-radius:18px;padding:40px 44px;box-shadow:0 10px 40px rgba(31,95,166,.15);text-align:center;max-width:380px}
.auth-title{font-size:20px;font-weight:700;margin-bottom:6px;color:#111827}
.auth-sub{font-size:13px;color:#6b8ab0;margin-bottom:24px}
.auth-btn-wrap{display:flex;justify-content:center;min-height:44px}
.auth-loading{font-size:13px;color:#6b8ab0;margin-top:16px;display:none}
.auth-loading.show{display:block}
.denied-icon{font-size:40px;margin-bottom:10px}
.denied-title{font-size:18px;font-weight:700;color:#dc2626;margin-bottom:8px}
.denied-sub{font-size:13px;color:#6b8ab0;margin-bottom:20px;line-height:1.6}
.denied-email{font-size:12px;color:#555;background:#f9fafb;padding:6px 12px;border-radius:8px;margin-bottom:18px;display:inline-block}
.btn-dark{background:#1F5FA6;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer}

#app{display:none;width:100%;height:100%}

/* ── App shell (same visual design as before) ─────────────────── */
.wrapper{display:flex;flex-direction:column;height:100%;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 28px 12px;position:relative;background:#1F5FA6;flex-wrap:wrap;gap:8px}
.top-left{flex:1;min-width:0}
.greet{font-size:26px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.firm-line{display:flex;align-items:center;gap:10px;margin-top:5px}
.firm-divider{width:28px;height:2px;background:rgba(255,255,255,0.45);flex-shrink:0}
.firm{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.75)}
.portal-sub{font-size:10px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-top:14px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px;flex-shrink:0}
.icons-row{display:flex;align-items:center;gap:10px}
.bell-wrap{position:relative;cursor:pointer;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bell-svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell-badge{position:absolute;top:-6px;right:-6px;background:#f59e0b;color:#fff;font-size:9px;font-weight:700;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #1F5FA6}
.profile{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;flex-shrink:0}
.date{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.65)}
.time{font-size:34px;font-weight:300;color:#fff;letter-spacing:2px;line-height:1}
.ampm{font-size:13px;font-weight:500;color:rgba(255,255,255,0.75);margin-left:4px}
.top-accent{height:3px;background:linear-gradient(90deg,#0d3466,#1F5FA6,#4a90d9,#1F5FA6,#0d3466);flex-shrink:0}
.ann-panel{display:none;position:absolute;top:72px;right:80px;width:300px;background:#fff;border:1px solid #c9d9ef;border-radius:12px;padding:16px;z-index:999;box-shadow:0 10px 32px rgba(31,95,166,0.18)}
.ann-panel.open{display:block}
.ann-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#1F5FA6;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e5edf8;display:flex;align-items:center;gap:8px}
.ann-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f4fa}
.ann-item:last-child{border-bottom:none}
.ann-dot{width:7px;height:7px;border-radius:50%;background:#1F5FA6;margin-top:4px;flex-shrink:0}
.ann-msg{font-size:12px;color:#111827;line-height:1.6;flex:1;font-weight:500}
.ann-date{font-size:10px;color:#6b8ab0;white-space:nowrap;margin-top:2px}
.ann-empty{font-size:12px;color:#6b8ab0;text-align:center;padding:8px 0;font-style:italic}
.ann-ticker-wrap{margin:10px 28px 0;background:#1F5FA6;border-radius:9px;padding:9px 16px;display:flex;align-items:center;gap:12px;min-height:38px;overflow:hidden;flex-shrink:0}
.ticker-label{font-size:9px;font-weight:700;letter-spacing:2px;color:#fff;text-transform:uppercase;white-space:nowrap;border-right:1.5px solid rgba(255,255,255,0.25);padding-right:12px;display:flex;align-items:center;gap:7px}
.ticker-live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:livepulse 2s infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:0.3}}
.ticker-slider{flex:1;position:relative;overflow:hidden;height:20px}
.ticker-track{position:absolute;top:0;left:0;white-space:nowrap;display:flex;align-items:center;height:20px;font-size:12px;font-weight:500;color:#fff;animation-name:tickerScroll;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
.ticker-sep{margin:0 30px;color:rgba(255,255,255,0.45);font-size:8px}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.profile-popup{display:none;position:absolute;top:68px;right:28px;background:#fff;border:1px solid #c9d9ef;border-radius:12px;padding:22px 26px;z-index:1000;min-width:210px;box-shadow:0 10px 32px rgba(31,95,166,0.18);text-align:center}
.profile-popup.open{display:block}
.photo-edit-wrap{position:relative;width:72px;margin:0 auto 6px}
.profile-big{width:72px;height:72px;border-radius:50%;background:#e8eef6;border:2.5px solid #b0c4de;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#1F5FA6;overflow:hidden}
.photo-edit-btn{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:#1F5FA6;border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;line-height:1;z-index:10}
.upload-status{font-size:10px;color:#1F5FA6;margin-bottom:4px;min-height:14px;text-align:center}
.remove-photo-btn{font-size:10px;font-weight:600;color:#dc2626;background:#fff5f5;border:1.5px solid #fca5a5;border-radius:20px;padding:5px 14px;cursor:pointer;margin-top:4px;margin-bottom:2px;display:none;transition:all 0.2s;letter-spacing:0.5px}
.remove-photo-btn:hover{background:#dc2626;color:#fff;border-color:#dc2626}
.view-photo-hint{font-size:11px;color:#6b8ab0;margin-bottom:10px;cursor:pointer}
.profile-name{font-size:14px;font-weight:700;color:#111827;margin-bottom:4px}
.profile-email{font-size:11px;color:#6b8ab0;word-break:break-all}
.notepad-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,30,70,0.7);z-index:9998;align-items:center;justify-content:center}
.notepad-modal.open{display:flex}
.notepad-box{background:#fff;border-radius:16px;width:90%;max-width:480px;padding:24px;box-shadow:0 16px 48px rgba(31,95,166,0.22);display:flex;flex-direction:column;gap:14px}
.notepad-header{display:flex;align-items:center;justify-content:space-between}
.notepad-title{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#1F5FA6;display:flex;align-items:center;gap:8px}
.notepad-close{width:28px;height:28px;border-radius:50%;background:#f0f4fa;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#6b8ab0}
.notepad-close:hover{background:#e5edf8}
.notepad-area{width:100%;height:200px;border:1.5px solid #c9d9ef;border-radius:10px;padding:12px 14px;font-family:"Google Sans",Roboto,sans-serif;font-size:13px;color:#111827;line-height:1.7;resize:none;outline:none;background:#f8fafd;transition:border 0.2s}
.notepad-area:focus{border-color:#1F5FA6;background:#fff}
.notepad-footer{display:flex;align-items:center;justify-content:space-between;gap:10px}
.notepad-saved{font-size:10px;color:#9ab0c8;letter-spacing:0.5px;flex:1}
.notepad-chars{font-size:10px;color:#b0c4de}
.notepad-save-btn{background:#1F5FA6;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-family:"Google Sans",Roboto,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all 0.2s}
.notepad-save-btn:hover{background:#0d3466;transform:translateY(-1px)}
.notepad-save-btn:disabled{background:#b0c4de;cursor:not-allowed;transform:none}
.notepad-btn-wrap{position:relative;cursor:pointer;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.notepad-btn-wrap:hover{background:rgba(255,255,255,0.22)}
.photo-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,30,70,0.9);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.photo-modal.open{display:flex}
.photo-modal img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.4)}
.photo-modal-name{font-size:18px;font-weight:600;color:#fff}
.photo-modal-close{font-size:12px;color:rgba(255,255,255,0.7);cursor:pointer;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:6px 22px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 16px;background:#fff;border-top:1px solid #e5edf8;border-bottom:1px solid #e5edf8;margin-top:10px;flex-shrink:0}
.btn{font-family:"Google Sans",Roboto,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#1a3a60;background:#f5f8fd;border:1.5px solid #c9d9ef;border-left:4px solid #1F5FA6;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.22s;white-space:nowrap}
.btn:hover{background:#1F5FA6;color:#fff;border-color:#1F5FA6;border-left-color:#0d3466;transform:translateY(-2px);box-shadow:0 4px 16px rgba(31,95,166,0.28)}
.gov-links-wrap{background:linear-gradient(180deg,#eef4ff 0%,#f5f8fd 55%,#ffffff 100%);border-bottom:1px solid #dce8f7;flex-shrink:0;padding:4px 0 10px}
.gov-links-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#1F5FA6;text-align:center;padding-top:12px;padding-bottom:2px;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 24px}
.gov-links-title::before,.gov-links-title::after{content:"";flex:1;max-width:70px;height:1.5px;background:linear-gradient(90deg,transparent,#a9c3e6)}
.gov-links-title::after{background:linear-gradient(90deg,#a9c3e6,transparent)}
.gov-row{border-top:none;border-bottom:none;margin-top:6px;background:transparent}
.gov-row .btn{background:#fff;border-color:#b8cdea}
.gov-row .btn:hover{background:#1F5FA6;border-color:#1F5FA6}
.highlights{padding:16px 28px 12px;flex:1;display:flex;flex-direction:column;align-items:center;background:#fff;overflow-y:auto}
.hl-title{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1F5FA6;margin-bottom:16px;text-align:center;width:100%;display:flex;align-items:center;gap:14px}
.hl-title::before,.hl-title::after{content:"";flex:1;height:1.5px;background:#e5edf8}
.hl-group{margin-bottom:14px;width:100%;display:flex;flex-direction:column;align-items:center}
.hl-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;background:#1F5FA6;border:none;border-radius:20px;padding:5px 16px;margin-bottom:12px;text-align:center;display:inline-block}
.hl-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hl-card{background:#f5f8fd;border:1.5px solid #c9d9ef;border-radius:12px;padding:11px 16px;display:flex;align-items:center;gap:12px;min-width:200px;box-shadow:0 2px 8px rgba(31,95,166,0.07)}
.hl-card-birthday{border-left:4px solid #f59e0b;background:linear-gradient(135deg,#fffbf0,#f5f8fd)}
.hl-card-anniv{border-left:4px solid #1F5FA6;background:linear-gradient(135deg,#eef4ff,#f5f8fd)}
.hl-card-new{border-left:4px solid #10b981;background:linear-gradient(135deg,#ecfdf5,#f5f8fd)}
.hl-icon-wrap{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hl-icon-birthday{background:#fff8e8;border:1.5px solid #f59e0b}
.hl-icon-anniv{background:#e8f0fb;border:1.5px solid #1F5FA6}
.hl-icon-new{background:#d1fae5;border:1.5px solid #10b981}
.hl-name{font-size:13px;font-weight:700;color:#111827;margin-bottom:2px}
.hl-sub{font-size:11px;color:#4b5563;font-weight:400}
.hl-chip{background:#e8f0fb;border:1.5px solid #b0c4de;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:600;color:#111827;display:flex;align-items:center;gap:10px}
.hl-badge{background:#1F5FA6;border-radius:10px;padding:3px 9px;font-size:10px;color:#fff;font-weight:700}
.hl-empty-grid{display:flex;flex-direction:column;gap:14px;width:100%;max-width:420px;padding-top:6px}
.hl-empty-card{background:#f8fafd;border:1.5px solid #dce8f5;border-left:4px solid #c9d9ef;border-radius:10px;padding:18px 20px;font-size:12px;font-weight:500;color:#6b8ab0;display:flex;align-items:center;gap:14px;line-height:1.5}
.hl-empty-icon{font-size:20px;flex-shrink:0;opacity:0.7}
.hl-empty-title{font-size:12px;font-weight:600;color:#4b5563;margin-bottom:3px}
.hl-empty-desc{font-size:11px;color:#9ab0c8;font-weight:400}
@media(max-width:600px){
.top{padding:10px 14px 10px;gap:6px}
.greet{font-size:18px}
.firm{font-size:9px;letter-spacing:1.5px}
.portal-sub{font-size:9px;letter-spacing:1.2px}
.time{font-size:24px;letter-spacing:1px}
.ampm{font-size:11px}
.date{font-size:9px;letter-spacing:1.5px}
.top-right{gap:4px}
.icons-row{gap:8px}
.bell-wrap{width:32px;height:32px}
.profile{width:32px;height:32px;font-size:12px}
.ann-ticker-wrap{margin:8px 10px 0;padding:7px 12px}
.ticker-label{font-size:8px;padding-right:10px}
.btn-row{padding:8px 10px;gap:6px}
.btn{font-size:9px;padding:8px 12px;letter-spacing:1px}
.gov-links-title{font-size:8px;letter-spacing:1.5px;margin:0 10px}
.gov-links-title::before,.gov-links-title::after{max-width:30px}
.highlights{padding:12px 10px 10px}
.hl-title{font-size:10px;letter-spacing:2px}
.ann-panel{right:8px;width:calc(100vw - 24px);top:58px}
.profile-popup{right:8px;min-width:180px;top:58px}
.hl-card{min-width:160px;padding:10px 14px}
}
@media(max-width:380px){
.greet{font-size:16px}
.time{font-size:20px}
.btn{font-size:8px;padding:7px 10px}
}
</style>
</head>
<body>

<div id="loader">
  <div class="logo">🏛 Umesh Bolmal &amp; Associates</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="msg">Loading your dashboard…</div>
</div>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-title">Staff Portal</div>
    <div class="auth-sub">Sign in with your company Google account to continue</div>
    <div class="auth-btn-wrap" id="googleSignInBtn"></div>
    <div class="auth-loading" id="authLoadingTxt">Verifying access…</div>
  </div>
</div>

<div class="denied-screen" id="deniedScreen">
  <div class="denied-box">
    <div class="denied-icon">🚫</div>
    <div class="denied-title">Access Denied</div>
    <div class="denied-sub">This portal is restricted to staff accounts only.</div>
    <div class="denied-email" id="deniedEmail"></div>
    <button class="btn-dark" onclick="doLogout()">Try a Different Account</button>
  </div>
</div>

<div id="app"></div>

<script>
/* ⚠️ Replace with your deployed Apps Script Web App /exec URL */
var API = "https://script.google.com/a/macros/ugbolmalassociates.com/s/AKfycbzqpQNWEvLHylO5j7K9lzwYitGoU0QGEwIYx8evMwQ4p4pr13MEQhgt3msaiVZjNTYfZQ/exec";
/* ⚠️ Must match the Apps Script backend's GOOGLE_CLIENT_ID */
var GOOGLE_CLIENT_ID = "567925868040-kv22o4qhj5rmreiaka4odpth50v99ndf.apps.googleusercontent.com";

var currentIdToken = null;
var currentUserEmail = null;
var portalData = null;
var notepadLoaded = false;

/* ── Google Sign-In ───────────────────────────────────────────── */
function decodeJwtPayload(token) {
  try {
    var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')));
  } catch (e) { return null; }
}

function handleCredentialResponse(response) {
  currentIdToken = response.credential;
  try { localStorage.setItem('ugb_portal_idtoken', currentIdToken); } catch (e) {}
  verifyAndEnter();
}

function verifyAndEnter() {
  if (!currentIdToken) return showSignIn();
  var payload = decodeJwtPayload(currentIdToken);
  if (!payload || !payload.exp || payload.exp * 1000 < Date.now()) {
    try { localStorage.removeItem('ugb_portal_idtoken'); } catch (e) {}
    return showSignIn();
  }
  hideAll();
  document.getElementById('authScreen').classList.add('show');
  document.getElementById('authLoadingTxt').classList.add('show');
  fetch(API + '?action=auth&idToken=' + encodeURIComponent(currentIdToken) + '&cb=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(res) {
      document.getElementById('authLoadingTxt').classList.remove('show');
      if (res.authorized) {
        currentUserEmail = res.email || payload.email;
        loadPortal();
      } else {
        showDenied(res.email || payload.email);
      }
    })
    .catch(function() {
      document.getElementById('authLoadingTxt').classList.remove('show');
      showDenied(payload.email);
    });
}

function hideAll() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('authScreen').classList.remove('show');
  document.getElementById('deniedScreen').classList.remove('show');
  document.getElementById('app').style.display = 'none';
}

function showSignIn() {
  hideAll();
  document.getElementById('authScreen').classList.add('show');
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.renderButton(document.getElementById('googleSignInBtn'), { theme: 'outline', size: 'large', width: 260 });
  }
}

function showDenied(email) {
  hideAll();
  document.getElementById('deniedScreen').classList.add('show');
  document.getElementById('deniedEmail').textContent = email || '';
}

function doLogout() {
  try { localStorage.removeItem('ugb_portal_idtoken'); } catch (e) {}
  currentIdToken = null; currentUserEmail = null;
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  showSignIn();
}

function initGoogleAuth() {
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(initGoogleAuth, 200); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse, auto_select: true });
  var saved = null;
  try { saved = localStorage.getItem('ugb_portal_idtoken'); } catch (e) {}
  if (saved) { currentIdToken = saved; verifyAndEnter(); }
  else { showSignIn(); google.accounts.id.prompt(); }
}

/* ── Load portal data & render ───────────────────────────────── */
function loadPortal() {
  hideAll();
  document.getElementById('loader').style.display = 'flex';
  fetch(API + '?action=getData&idToken=' + encodeURIComponent(currentIdToken) + '&cb=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.authorized) { showDenied(currentUserEmail); return; }
      portalData = data;
      renderApp(data);
      hideAll();
      document.getElementById('app').style.display = 'block';
    })
    .catch(function(err) {
      document.getElementById('loader').innerHTML = '<div class="err">⚠ Could not load.<br><small>' + err.message + '</small><br><button class="retry" onclick="location.reload()">Retry</button></div>';
    });
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderApp(d) {
  var profileIconHtml = d.photoUrl
    ? '<div class="profile" onclick="toggleProfile()" id="profileBtn"><img src="' + d.photoUrl + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.parentNode.textContent=\'' + d.initials + '\'"></div>'
    : '<div class="profile" onclick="toggleProfile()" id="profileBtn">' + d.initials + '</div>';

  var profileBigHtml = '<div class="photo-edit-wrap">'
    + (d.photoUrl
      ? '<div class="profile-big" style="padding:0;overflow:hidden" id="profileBigDiv"><img id="profileBigImg" src="' + d.photoUrl + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentNode.textContent=\'' + d.initials + '\'" onclick="viewPhoto()"></div>'
      : '<div class="profile-big" id="profileBigDiv">' + d.initials + '</div>')
    + '<div class="photo-edit-btn" onclick="document.getElementById(\'photoFileInput\').click()" title="Change photo">✎</div></div>'
    + '<input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="uploadProfilePhoto(this)">'
    + '<div class="upload-status" id="uploadStatus"></div>'
    + (d.photoUrl ? '<div class="view-photo-hint" onclick="viewPhoto()">👁 View Photo</div>' : '')

  var annCount = (d.announcements || []).length;

    if (d.birthdays.length) {
      hlHtml += '<div class="hl-group"><div class="hl-label">🎂 Birthday Today</div><div class="hl-row">';

      });
      hlHtml += '</div></div>';
    }
    if (d.anniversaries.length) {
      hlHtml += '<div class="hl-group"><div class="hl-label">🎊 Work Anniversary Today</div><div class="hl-row">';
      d.anniversaries.forEach(function(a) {
        var cardClass = a.years === 0 ? 'hl-card-new' : 'hl-card-anniv';
        var iconClass = a.years === 0 ? 'hl-icon-new' : 'hl-icon-anniv';
        var icon = a.years === 0 ? '🎉' : '🎊';
        hlHtml += '<div class="hl-card ' + cardClass + '"><div class="hl-icon-wrap ' + iconClass + '">' + icon + '</div><div><div class="hl-name">' + esc(a.name) + '</div><div class="hl-sub">' + esc(a.label) + '</div></div></div>';
      });
      hlHtml += '</div></div>';
    }
    if (d.upcoming7.length) {
      hlHtml += '<div class="hl-group"><div class="hl-label">📅 Upcoming Birthday This Week</div><div class="hl-row">';
      d.upcoming7.forEach(function(u) {
        hlHtml += '<div class="hl-chip">' + esc(u.name) + ' · ' + esc(u.date) + '<span class="hl-badge">in ' + u.days + 'd</span></div>';
      });
      hlHtml += '</div></div>';
    }
  } else {
    hlHtml = '<div class="hl-empty-grid">'
      + '<div class="hl-empty-card"><span class="hl-empty-icon">🎂</span><div><div class="hl-empty-title">No Birthdays This Week</div><div class="hl-empty-desc">Check back next week for upcoming birthdays</div></div></div>'
      + '<div class="hl-empty-card"><span class="hl-empty-icon">🎊</span><div><div class="hl-empty-title">No Work Anniversaries This Month</div><div class="hl-empty-desc">No joining anniversaries falling this month</div></div></div>'
      + '<div class="hl-empty-card"><span class="hl-empty-icon">📅</span><div><div class="hl-empty-title">No Upcoming Staff Events This Week</div><div class="hl-empty-desc">All clear — nothing scheduled in the next 7 days</div></div></div>'
      + '</div>';
  }

  var govLinksHtml = (d.quickLinks || []).map(function(l) {
    return '<a class="btn" href="' + esc(l.url) + '" target="_blank">🔗 ' + esc(l.name) + '</a>';
  }).join('');

  var html = ''
    + '<div class="wrapper">'
    + '<div class="top">'
    + '<div class="top-left"><div class="greet">' + esc(d.greeting) + ', ' + esc(d.name) + '!</div>'
    + '<div class="firm-line"><div class="firm-divider"></div><div class="firm">Umesh Bolmal &amp; Associates</div></div>'
    + '<div class="portal-sub">Internal Operations &amp; Staff Management Portal</div></div>'
    + '<div class="top-right"><div class="icons-row">'
    + '<div class="bell-wrap" onclick="toggleAnn()" id="bellBtn"><svg class="bell-svg" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
    + (annCount > 0 ? '<span class="bell-badge">' + annCount + '</span>' : '') + '</div>'
    + '<div class="notepad-btn-wrap" onclick="openNotepad()" title="My Notepad">📝</div>'
    + profileIconHtml
    + '</div><div class="date">' + esc(d.dateStr) + '</div><div class="time" id="clock"></div></div>'
    + '<div class="ann-panel" id="annPanel"><div class="ann-title"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1F5FA6" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Announcements</div>' + annPanelHtml + '</div>'
    + '<div class="profile-popup" id="profilePopup">' + profileBigHtml + '<div class="profile-name">' + esc(d.name) + '</div><div class="profile-email">' + esc(d.email) + '</div></div>'
    + '</div>'
    + '<div class="top-accent"></div>'
    + '<div class="ann-ticker-wrap" id="annTicker"><div class="ticker-label"><div class="ticker-live-dot"></div>Notice</div><div class="ticker-slider" id="tickerSlider"></div></div>'
    + '<div class="photo-modal" id="photoModal" onclick="closePhoto()">'
    + (d.photoUrl ? '<img src="' + d.photoUrl + '" id="photoModalImg" onclick="event.stopPropagation()">' : '')
    + '<div class="photo-modal-name">' + esc(d.name) + '</div><div class="photo-modal-close" onclick="closePhoto()">✕ Close</div></div>'
    + '<div class="btn-row">'
    + '<a class="btn" href="https://datastudio.google.com/embed/reporting/b8cb5428-6c70-42f2-ba91-70fc3a64da3d/page/qzoyF" target="_blank">📋 My Tasks</a>'
    + '<a class="btn" href="https://ugb-design.github.io/EM-DASHBOARD/INDEX.html" target="_blank">📅 My Dashboard</a>'
    + '<a class="btn" href="https://script.google.com/a/macros/ugbolmalassociates.com/s/AKfycby4BXW15m-svwc744uWItA1nQGp4Kt3IiqZoWTlzwew3g3PDuJTwPbx4M49dwYc6AmqFQ/exec" target="_blank">📄 Google Forms</a>'
    + '<a class="btn" href="https://script.google.com/a/macros/ugbolmalassociates.com/s/AKfycbzFqAcz5qcBmRTnav3Rze55Wd0SApEOpjm9KK-kQmndyletqJcNdzf3dlNrMKQir6r_Xg/exec" target="_blank">👤 My Profile</a>'
    + '<a class="btn" href="https://www.appsheet.com/start/e593f206-628c-4174-a375-4012a703c619#view=Apply%20Leave" target="_blank">📅 Apply Leave</a>'
    + '</div>'
    + (govLinksHtml ? '<div class="gov-links-wrap"><div class="gov-links-title">🏛 Quick Access Portals</div><div class="btn-row gov-row">' + govLinksHtml + '</div></div>' : '')
    + '<div class="highlights"><div class="hl-title">Staff Highlights</div>' + hlHtml + '</div>'
    + '<div class="notepad-modal" id="notepadModal" onclick="notepadOutsideClick(event)"><div class="notepad-box" id="notepadBox">'
    + '<div class="notepad-header"><div class="notepad-title">📝 My Private Notepad</div><button class="notepad-close" onclick="closeNotepad()">✕</button></div>'
    + '<textarea class="notepad-area" id="notepadArea" placeholder="Write your private notes here… only you can see this." maxlength="2000" oninput="notepadInput()"></textarea>'
    + '<div class="notepad-footer"><div class="notepad-saved" id="notepadSaved">Loading…</div><div class="notepad-chars" id="notepadChars">0 / 2000</div><button class="notepad-save-btn" id="notepadSaveBtn" onclick="saveNotepad()">💾 Save</button></div>'
    + '</div></div>'
    + '</div>';

  document.getElementById('app').innerHTML = html;
  wireUpEvents(d);
}

/* ── Wire up interactivity after render ─────────────────────── */
function wireUpEvents(d) {
  updateClock(); setInterval(updateClock, 1000);

  document.addEventListener('click', function(e) {
    var panel = document.getElementById('annPanel'), bell = document.getElementById('bellBtn');
    var popup = document.getElementById('profilePopup'), prof = document.getElementById('profileBtn');
    if (panel && bell && !bell.contains(e.target) && !panel.contains(e.target)) panel.classList.remove('open');
    if (popup && prof && !prof.contains(e.target) && !popup.contains(e.target)) popup.classList.remove('open');
  });

  // Announcement ticker
  var anns = d.announcements || [];
  var slider = document.getElementById('tickerSlider');
  var wrap = document.getElementById('annTicker');
  if (!anns.length) { wrap.style.display = 'none'; }
  else {
    var sep = '<span class="ticker-sep">●</span>';
    var pieces = anns.map(function(a) { return esc(a.msg) + (a.date ? " <span style='color:rgba(255,255,255,0.55);font-size:10px;'>· " + esc(a.date) + "</span>" : ''); });
    var single = pieces.join(sep);
    var track = document.createElement('div');
    track.className = 'ticker-track';
    track.innerHTML = single + sep + single + sep;
    slider.appendChild(track);
    function startMarquee() {
      var contentWidth = track.scrollWidth / 2;
      var duration = Math.max(contentWidth / 55, 10);
      track.style.animationDuration = duration + 's';
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(startMarquee); else startMarquee();
    setTimeout(startMarquee, 300);
  }
}

function updateClock() {
  var n = new Date(), h = n.getHours(), m = n.getMinutes().toString().padStart(2, '0'), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  var el = document.getElementById('clock');
  if (el) el.innerHTML = h + ':' + m + '<span class="ampm">' + ap + '</span>';
}

function toggleAnn() { document.getElementById('annPanel').classList.toggle('open'); document.getElementById('profilePopup').classList.remove('open'); }
function toggleProfile() { document.getElementById('profilePopup').classList.toggle('open'); document.getElementById('annPanel').classList.remove('open'); }
function viewPhoto() { document.getElementById('profilePopup').classList.remove('open'); document.getElementById('photoModal').classList.add('open'); }
function closePhoto() { document.getElementById('photoModal').classList.remove('open'); }

/* ── Profile photo upload/remove ──────────────────────────────── */
function apiPost(action, extra) {
  var body = Object.assign({ action: action, idToken: currentIdToken }, extra || {});
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); });
}

function uploadProfilePhoto(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 3 * 1024 * 1024) { document.getElementById('uploadStatus').textContent = 'Max size is 3 MB'; return; }
  document.getElementById('uploadStatus').textContent = 'Uploading…';
  var reader = new FileReader();
  reader.onload = function(e) {
    var b64 = e.target.result.split(',')[1];
    apiPost('saveProfilePhoto', { base64Data: b64, mimeType: file.type }).then(function(res) {
      if (res.authorized === false) { showDenied(currentUserEmail); return; }
      if (res.photoUrl) {
        document.getElementById('uploadStatus').textContent = '✔ Photo updated!';
        setTimeout(function() { document.getElementById('uploadStatus').textContent = ''; }, 3000);
        portalData.photoUrl = res.photoUrl;
        var bigDiv = document.getElementById('profileBigDiv');
        bigDiv.style.padding = '0'; bigDiv.style.overflow = 'hidden';
        bigDiv.innerHTML = "<img id='profileBigImg' src='" + res.photoUrl + "' style='width:100%;height:100%;object-fit:cover;border-radius:50%' onclick='viewPhoto()'>";
        if (!document.querySelector('.view-photo-hint')) {
          var hint = document.createElement('div');
          hint.className = 'view-photo-hint'; hint.textContent = '👁 View Photo'; hint.onclick = viewPhoto;
          document.getElementById('uploadStatus').parentNode.insertBefore(hint, document.getElementById('uploadStatus').nextSibling);
        }
        var modalImg = document.getElementById('photoModalImg');
        if (modalImg) modalImg.src = res.photoUrl;
        else {
          var mi = document.createElement('img'); mi.id = 'photoModalImg'; mi.src = res.photoUrl;
          mi.style = "width:200px;height:200px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.4)";
          mi.onclick = function(ev) { ev.stopPropagation(); };
          document.getElementById('photoModal').insertBefore(mi, document.getElementById('photoModal').firstChild);
        }
        document.getElementById('profileBtn').innerHTML = "<img src='" + res.photoUrl + "' style='width:100%;height:100%;border-radius:50%;object-fit:cover'>";
        var rb = document.getElementById('removePhotoBtn'); if (rb) rb.style.display = 'inline-block';
      } else {
        document.getElementById('uploadStatus').textContent = 'Upload failed. Try again.';
      }
    }).catch(function(err) { document.getElementById('uploadStatus').textContent = 'Error: ' + err.message; });
  };
  reader.readAsDataURL(file);
}

function removePhoto() {
  if (!confirm('Remove your profile photo?')) return;
  document.getElementById('uploadStatus').textContent = 'Removing…';
  apiPost('removeProfilePhoto').then(function(res) {
    if (res.authorized === false) { showDenied(currentUserEmail); return; }
    document.getElementById('uploadStatus').textContent = '✔ Photo removed!';
    setTimeout(function() { document.getElementById('uploadStatus').textContent = ''; }, 3000);
    var initials = portalData.initials;
    var bigDiv = document.getElementById('profileBigDiv');
    bigDiv.style.padding = ''; bigDiv.style.overflow = ''; bigDiv.textContent = initials;
    var hint = document.querySelector('.view-photo-hint'); if (hint) hint.style.display = 'none';
    document.getElementById('removePhotoBtn').style.display = 'none';
    document.getElementById('profileBtn').textContent = initials;
    var mi = document.getElementById('photoModalImg'); if (mi) mi.remove();
    portalData.photoUrl = '';
  }).catch(function(err) { document.getElementById('uploadStatus').textContent = 'Error: ' + err.message; });
}

/* ── Notepad ──────────────────────────────────────────────────── */
function openNotepad() {
  document.getElementById('notepadModal').classList.add('open');
  document.getElementById('annPanel').classList.remove('open');
  document.getElementById('profilePopup').classList.remove('open');
  if (!notepadLoaded) {
    document.getElementById('notepadSaved').textContent = 'Loading…';
    var area = document.getElementById('notepadArea');
    var n = portalData.note || { note: '', saved: '' };
    notepadLoaded = true;
    area.value = n.note || '';
    notepadInput();
    document.getElementById('notepadSaved').textContent = n.saved ? 'Last saved: ' + n.saved : 'Not saved yet';
  }
}
function closeNotepad() { document.getElementById('notepadModal').classList.remove('open'); }
function notepadOutsideClick(e) { if (e.target === document.getElementById('notepadModal')) closeNotepad(); }
function notepadInput() {
  var len = document.getElementById('notepadArea').value.length;
  document.getElementById('notepadChars').textContent = len + ' / 2000';
}
function saveNotepad() {
  var text = document.getElementById('notepadArea').value;
  var btn = document.getElementById('notepadSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  apiPost('saveNote', { note: text }).then(function(res) {
    btn.disabled = false; btn.textContent = '💾 Save';
    if (res.authorized === false) { showDenied(currentUserEmail); return; }
    document.getElementById('notepadSaved').textContent = 'Last saved: ' + res.saved;
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = '💾 Save';
    document.getElementById('notepadSaved').textContent = 'Save failed: ' + err.message;
  });
}

/* ── Boot ─────────────────────────────────────────────────────── */
initGoogleAuth();
</script>
