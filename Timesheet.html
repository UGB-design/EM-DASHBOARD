<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Dashboard – Timesheet</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#eef3fb;color:#14284b;padding:16px}
  .bar,.panel{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(20,40,80,.08);padding:14px 18px}
  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .bar label{font-weight:600}
  .bar .f{display:flex;align-items:center;gap:8px}
  select,input{padding:9px 12px;border:1px solid #cfd8e8;border-radius:10px;font-size:15px;background:#fff;color:#14284b}
  #client{min-width:260px}
  button{cursor:pointer;font-size:15px;border-radius:10px;border:1px solid #cfd8e8;padding:9px 16px;background:#fff;color:#0b2a6b;font-weight:600}
  .reset{background:#dce8fb}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:16px 0}
  .card{border-radius:16px;padding:18px 22px}
  .card small{font-size:16px;font-weight:600;display:block}
  .card b{font-size:34px}
  .c1{background:#dfeafb}.c2{background:#d9f5e3}.c3{background:#fdeacb}.c4{background:#e8e0fb}
  .tabs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:12px 22px;border-radius:10px}
  .tab.active{background:#0b3a8c;color:#fff;border-color:#0b3a8c}
  .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .head h2{margin:0;font-size:22px}
  .pill.active{background:#0b3a8c;color:#fff}
  .wrap{overflow-x:auto;border:1px solid #e2e8f3;border-radius:12px}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{background:#0b3a8c;color:#fff;text-align:left;padding:13px 12px;font-size:15px}
  td{padding:11px 12px;border-bottom:1px solid #e8edf6;font-size:15px}
  tr:nth-child(even) td{background:#f8faff}
  tr.grp td{background:#e3ecfb!important;font-weight:700}
  tr.tot td{background:#f0f4fb!important;font-weight:700}
  .st{display:inline-block;padding:5px 14px;border-radius:8px;font-weight:600;font-size:14px}
  .done{background:#d6f5df;color:#14733a}
  .prog{background:#fdeabf;color:#a85d00}
  .pend{background:#fde0e0;color:#c62828}
  .msg{padding:30px;text-align:center;color:#5a6b8c}
  .hide{display:none}
</style>
</head>
<body>

<div class="bar">
  <div class="f"><label>Select Client</label>
    <input id="client" list="clientList" placeholder="All Clients (type to search)">
    <datalist id="clientList"></datalist></div>
  <div class="f"><label>Select Employee</label>
    <select id="emp"><option value="">All Employees</option></select></div>
  <div class="f"><label>Period</label>
    <select id="period"></select>
    <span id="custom" class="hide"><input type="date" id="from"> – <input type="date" id="to"></span></div>
  <button class="reset" id="reset">⟲ Reset</button>
</div>

<div class="cards">
  <div class="card c1"><small>Total Work Items</small><b id="sTotal">0</b></div>
  <div class="card c2"><small>Completed</small><b id="sDone">0</b></div>
  <div class="card c3"><small>Pending</small><b id="sPend">0</b></div>
  <div class="card c4"><small>Total Time Spent</small><b id="sTime">0 hrs 00 mins</b></div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="hist">👥 Client Wise History</button>
  <button class="tab" data-tab="summ">👤 Employee Wise Summary</button>
</div>

<div class="panel">
  <div id="histBox">
    <div class="head">
      <h2 id="title">Work History – All Clients</h2>
      <div><span style="margin-right:8px">View:</span>
        <button class="pill active" data-view="client">Client Wise (All Employees)</button>
        <button class="pill" data-view="emp">Employee Wise (Selected Client)</button></div>
    </div>
    <div class="wrap"><table id="histTbl"></table></div>
  </div>
  <div id="summBox" class="hide">
    <div class="head"><h2>Employee Wise Summary</h2></div>
    <div class="wrap"><table id="summTbl"></table></div>
  </div>
</div>

<script>
// ====== YAHAN APNA WEB APP URL DAALO ======
const API_URL = 'https://script.google.com/a/macros/ugbolmalassociates.com/s/AKfycbx_AUw0ptbydQyVuhKFaMubqMgcg5O-F6mwhAyIdkfO4nNjZKMqRxnbnIIG2M_NwDLN/exec';
// ==========================================

const $ = id => document.getElementById(id);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let RAW = [], VIEW = 'client', TAB = 'hist';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = iso => { const [y,m,d] = iso.split('-'); return iso ? `${d}-${MON[+m-1]}-${y}` : ''; };
function fmtMins(m){
  const h = Math.floor(m/60), r = m%60;
  return `${h} ${h===1?'hr':'hrs'} ${String(r).padStart(2,'0')} mins`;
}
function statusInfo(s){
  const t = s.toLowerCase();
  if (['done','completed','complete'].includes(t)) return ['done','✔ Done',true];
  if (t.includes('progress')) return ['prog','⏳ In Progress',false];
  return ['pend','◔ '+(s||'Pending'),false];
}
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function fyStart(){ const n = new Date(); return n.getMonth() >= 3 ? n.getFullYear() : n.getFullYear()-1; }

function initPeriods(){
  const cur = fyStart(), sel = $('period');
  sel.innerHTML = '';
  for (let y = cur+1; y >= cur-5; y--) {
    sel.innerHTML += `<option value="fy-${y}">01-Apr-${y} – 31-Mar-${y+1}</option>`;
  }
  sel.innerHTML += '<option value="month">This Month</option><option value="all">All Time</option><option value="custom">Custom Range</option>';
  sel.value = 'fy-' + cur;
}
function getRange(){
  const v = $('period').value;
  if (v.startsWith('fy-')) { const y = +v.slice(3); return [`${y}-04-01`, `${y+1}-03-31`]; }
  if (v === 'month') { const n = new Date(); return [iso(new Date(n.getFullYear(), n.getMonth(), 1)), iso(new Date(n.getFullYear(), n.getMonth()+1, 0))]; }
  if (v === 'custom') return [$('from').value || '', $('to').value || ''];
  return ['', ''];
}

async function api(params){
  const q = new URLSearchParams(params).toString();
  const r = await fetch(API_URL + '?' + q);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function loadMeta(){
  const m = await api({action:'meta'});
  $('clientList').innerHTML = m.clients.map(c => `<option value="${esc(c)}">`).join('');
  $('emp').innerHTML = '<option value="">All Employees</option>' + m.staff.map(s => `<option>${esc(s)}</option>`).join('');
}

async function loadData(){
  const [from, to] = getRange();
  setMsg('Loading data…');
  try {
    const j = await api({action:'data', client:$('client').value.trim(), from, to});
    RAW = j.rows;
    render();
  } catch(e){ setMsg('Error: ' + e.message); }
}
function setMsg(t){
  $('histTbl').innerHTML = `<tr><td class="msg">${esc(t)}</td></tr>`;
  $('summTbl').innerHTML = '';
}

function filtered(){
  const e = $('emp').value;
  return e ? RAW.filter(r => r.staff === e) : RAW;
}

function render(){
  const rows = filtered();
  const done = rows.filter(r => statusInfo(r.status)[2]).length;
  const mins = rows.reduce((a,r) => a + r.mins, 0);
  $('sTotal').textContent = rows.length;
  $('sDone').textContent = done;
  $('sPend').textContent = rows.length - done;
  $('sTime').textContent = fmtMins(mins);
  const c = $('client').value.trim();
  $('title').textContent = 'Work History – ' + (c || 'All Clients');
  renderHist(rows);
  renderSumm(rows);
}

function rowHtml(r, i, showClient){
  const [cls, label] = statusInfo(r.status);
  return `<tr><td>${i}</td><td>${fmtDate(r.date)}</td>
    ${showClient ? `<td>${esc(r.client)}</td>` : ''}
    <td>${esc(r.staff)}</td><td>${esc(r.type)}</td><td>${esc(r.task)}</td>
    <td>${fmtMins(r.mins)}</td><td><span class="st ${cls}">${label}</span></td></tr>`;
}

function renderHist(rows){
  const t = $('histTbl');
  if (!rows.length){ t.innerHTML = '<tr><td class="msg">Is selection ke liye koi record nahi mila.</td></tr>'; return; }
  const showClient = !$('client').value.trim();
  const cols = showClient ? 8 : 7;
  let h = `<tr><th>#</th><th>Date</th>${showClient?'<th>Client</th>':''}<th>Employee</th><th>Work Type</th><th>Task Description</th><th>Time Spent</th><th>Status</th></tr>`;
  if (VIEW === 'client') {
    rows.forEach((r,i) => h += rowHtml(r, i+1, showClient));
  } else {
    const g = {};
    rows.forEach(r => (g[r.staff || '—'] = g[r.staff || '—'] || []).push(r));
    Object.keys(g).sort().forEach(s => {
      const list = g[s], m = list.reduce((a,r) => a + r.mins, 0);
      h += `<tr class="grp"><td colspan="${cols}">${esc(s)} — ${list.length} items, ${fmtMins(m)}</td></tr>`;
      list.forEach((r,i) => h += rowHtml(r, i+1, showClient));
    });
  }
  t.innerHTML = h;
}

function renderSumm(rows){
  const g = {};
  rows.forEach(r => {
    const k = r.staff || '—';
    g[k] = g[k] || {n:0, d:0, m:0};
    g[k].n++; g[k].m += r.mins;
    if (statusInfo(r.status)[2]) g[k].d++;
  });
  const keys = Object.keys(g).sort();
  if (!keys.length){ $('summTbl').innerHTML = '<tr><td class="msg">Koi record nahi.</td></tr>'; return; }
  let h = '<tr><th>#</th><th>Employee</th><th>Total Items</th><th>Completed</th><th>Pending</th><th>Time Spent</th></tr>';
  let T = {n:0,d:0,m:0};
  keys.forEach((k,i) => {
    const x = g[k]; T.n += x.n; T.d += x.d; T.m += x.m;
    h += `<tr><td>${i+1}</td><td>${esc(k)}</td><td>${x.n}</td><td>${x.d}</td><td>${x.n-x.d}</td><td>${fmtMins(x.m)}</td></tr>`;
  });
  h += `<tr class="tot"><td></td><td>Total</td><td>${T.n}</td><td>${T.d}</td><td>${T.n-T.d}</td><td>${fmtMins(T.m)}</td></tr>`;
  $('summTbl').innerHTML = h;
}

// ===== Events =====
$('client').addEventListener('change', loadData);
$('emp').addEventListener('change', render);
$('period').addEventListener('change', () => {
  $('custom').classList.toggle('hide', $('period').value !== 'custom');
  if ($('period').value !== 'custom') loadData();
});
$('from').addEventListener('change', loadData);
$('to').addEventListener('change', loadData);
$('reset').addEventListener('click', () => {
  $('client').value = ''; $('emp').value = '';
  $('period').value = 'fy-' + fyStart();
  $('custom').classList.add('hide');
  loadData();
});
document.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); VIEW = b.dataset.view; render();
}));
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); TAB = b.dataset.tab;
  $('histBox').classList.toggle('hide', TAB !== 'hist');
  $('summBox').classList.toggle('hide', TAB !== 'summ');
}));

(async function(){
  initPeriods();
  try { await loadMeta(); } catch(e){ setMsg('Meta load error: ' + e.message); return; }
  loadData();
})();
</script>
</body>
</html>
