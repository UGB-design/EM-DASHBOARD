<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Dashboard – Timesheet</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#eef3fb;color:#14284b;padding:16px}
  .bar,.panel{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(20,40,80,.08);padding:14px 18px}
  .bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .bar label{font-weight:600}
  .bar .f{display:flex;align-items:center;gap:8px}
  select,input{padding:9px 12px;border:1px solid #cfd8e8;border-radius:10px;font-size:15px;background:#fff;color:#14284b}
  button{cursor:pointer;font-size:15px;border-radius:10px;border:1px solid #cfd8e8;padding:9px 16px;background:#fff;color:#0b2a6b;font-weight:600}
  .apply{background:#0b3a8c;color:#fff;border-color:#0b3a8c;padding:9px 26px}
  .apply:hover{background:#0a2f72}

  /* searchable client dropdown */
  .combo{position:relative;width:340px}
  .combo input{width:100%;padding-right:34px;cursor:pointer}
  .combo::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#5a6b8c}
  .list{position:absolute;top:100%;left:0;right:0;margin-top:4px;max-height:300px;overflow-y:auto;background:#fff;border:1px solid #cfd8e8;border-radius:10px;box-shadow:0 8px 24px rgba(20,40,80,.18);z-index:50}
  .list div{padding:9px 12px;font-size:14.5px;cursor:pointer;border-bottom:1px solid #f0f3f9}
  .list div:hover,.list div.hl{background:#e3ecfb}
  .list div.sel{font-weight:700;color:#0b3a8c}
  .list .none{color:#5a6b8c;cursor:default}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
 .card{border-radius:10px;padding:8px 14px}
.card small{font-size:13px;font-weight:600;display:block}
 .card b{font-size:20px}
  .c1{background:#dfeafb}.c2{background:#d9f5e3}.c3{background:#fdeacb}.c4{background:#e8e0fb}
  .tabs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:12px 22px;border-radius:10px}
  .tab.active{background:#0b3a8c;color:#fff;border-color:#0b3a8c}
  .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .head h2{margin:0;font-size:22px}
  .pill.active{background:#0b3a8c;color:#fff}
  .wrap{overflow-x:auto;border:1px solid #e2e8f3;border-radius:12px}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{background:#0b3a8c;color:#fff;text-align:left;padding:13px 12px;font-size:15px}
  td{padding:11px 12px;border-bottom:1px solid #e8edf6;font-size:15px}
  tr:nth-child(even) td{background:#f8faff}
  tr.grp td{background:#e3ecfb!important;font-weight:700}
  tr.tot td{background:#f0f4fb!important;font-weight:700}
  .st{display:inline-block;padding:5px 14px;border-radius:8px;font-weight:600;font-size:14px}
  .done{background:#d6f5df;color:#14733a}
  .prog{background:#fdeabf;color:#a85d00}
  .pend{background:#fde0e0;color:#c62828}
  .msg{padding:30px;text-align:center;color:#5a6b8c}
  .hide{display:none}
 .rad{display:inline-flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;margin-right:16px;font-size:15px}
.rad input{width:16px;height:16px;padding:0;accent-color:#0b3a8c;cursor:pointer}
</style>
</head>
<body>

<div class="bar">
  <div class="f"><label for="clientBox">Client</label>
    <div class="combo">
      <input id="clientBox" placeholder="All Clients" autocomplete="off">
      <div id="clientList" class="list hide"></div>
    </div>
  </div>
  <div class="f"><label for="emp">Employee</label>
    <select id="emp"><option value="">All Employees</option></select></div>
  <div class="f"><label for="from">From</label><input type="date" id="from">
    <label for="to">To</label><input type="date" id="to"></div>
  <button class="apply" id="apply">Apply</button>
</div>

<div class="cards">
  <div class="card c1"><small>Total Work Items</small><b id="sTotal">0</b></div>
  <div class="card c2"><small>Completed</small><b id="sDone">0</b></div>
  <div class="card c3"><small>Pending</small><b id="sPend">0</b></div>
  <div class="card c4"><small>Total Time Spent</small><b id="sTime">0 hrs 00 mins</b></div>
</div>

<div class="tabs">
  <label class="rad"><input type="radio" name="tab" value="hist" checked> Client Wise History</label>
  <label class="rad"><input type="radio" name="tab" value="summ"> Employee Wise Summary</label>
</div>

<div class="panel">
  <div id="histBox">
    <div class="head">
      <h2 id="title">Work History – All Clients</h2>
           <div><span style="margin-right:10px;font-weight:600">View:</span>
        <label class="rad"><input type="radio" name="view" value="client" checked> Client Wise (All Employees)</label>
        <label class="rad"><input type="radio" name="view" value="emp"> Employee Wise (Selected Client)</label></div>
    </div>
    <div class="wrap"><table id="histTbl"></table></div>
  </div>
  <div id="summBox" class="hide">
    <div class="head"><h2>Employee Wise Summary</h2></div>
    <div class="wrap"><table id="summTbl"></table></div>
  </div>
</div>

<script>
// ====== PASTE YOUR APPS SCRIPT WEB APP URL HERE ======
const API_URL = 'https://script.google.com/macros/s/AKfycbx_AUw0ptbydQyVuhKFaMubqMgcg5O-F6mwhAyIdkfO4nNjZKMqRxnbnIIG2M_NwDLN/exec';
// =====================================================

const $ = id => document.getElementById(id);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let RAW = [], VIEW = 'client', TAB = 'hist';
let CLIENTS = [], CLIENT = '';   // CLIENT = selected client ('' means all)

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}-${MON[+m-1]}-${y}`; };
function fmtMins(m){
  const h = Math.floor(m/60), r = m%60;
  return `${h} ${h===1?'hr':'hrs'} ${String(r).padStart(2,'0')} mins`;
}
function statusInfo(s){
  const t = String(s).toLowerCase();
  if (['done','completed','complete'].includes(t)) return ['done','✔ Done',true];
  if (t.includes('progress')) return ['prog','⏳ In Progress',false];
  return ['pend','◔ '+(s||'Pending'),false];
}

function fyStart(){ const n = new Date(); return n.getMonth() >= 3 ? n.getFullYear() : n.getFullYear()-1; }
function setDefaultDates(){
  const y = fyStart();
  $('from').value = `${y}-04-01`;
  $('to').value = `${y+1}-03-31`;
}

async function api(params){
  const q = new URLSearchParams(params).toString();
  const r = await fetch(API_URL + '?' + q);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function loadMeta(){
  const m = await api({action:'meta'});
  CLIENTS = m.clients;
  $('emp').innerHTML = '<option value="">All Employees</option>' + m.staff.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
}

async function loadData(){
  const from = $('from').value, to = $('to').value;
  if (from && to && from > to){ setMsg('The "From" date cannot be later than the "To" date.'); return; }
  setMsg('Loading data...');
  try {
    const j = await api({action:'data', client:CLIENT, from, to});
    RAW = j.rows;
    render();
  } catch(e){ setMsg('Error: ' + e.message); }
}
function setMsg(t){
  $('histTbl').innerHTML = `<tr><td class="msg">${esc(t)}</td></tr>`;
  $('summTbl').innerHTML = '';
}

function filtered(){
  const e = $('emp').value;
  return e ? RAW.filter(r => r.staff === e) : RAW;
}

function render(){
  const rows = filtered();
  const done = rows.filter(r => statusInfo(r.status)[2]).length;
  const mins = rows.reduce((a,r) => a + r.mins, 0);
  $('sTotal').textContent = rows.length;
  $('sDone').textContent = done;
  $('sPend').textContent = rows.length - done;
  $('sTime').textContent = fmtMins(mins);
  $('title').textContent = 'Work History – ' + (CLIENT || 'All Clients');
  renderHist(rows);
  renderSumm(rows);
}

function rowHtml(r, i, showClient){
  const [cls, label] = statusInfo(r.status);
   return `<tr><td>${i}</td><td>${fmtDate(r.date)}</td><td>${esc(r.slot)}</td>
    ${showClient ? `<td>${esc(r.client)}</td>` : ''}
    <td>${esc(r.staff)}</td><td>${esc(r.type)}</td><td>${esc(r.task)}</td>
    <td>${fmtMins(r.mins)}</td><td><span class="st ${cls}">${label}</span></td></tr>`;
}

function renderHist(rows){
  const t = $('histTbl');
  if (!rows.length){ t.innerHTML = '<tr><td class="msg">No records found for the selected filters.</td></tr>'; return; }
  const showClient = !CLIENT;
   const cols = showClient ? 9 : 8;
  let h = `<tr><th>#</th><th>Date</th><th>Time Slot</th>${showClient?'<th>Client</th>':''}<th>Employee</th><th>Work Type</th><th>Task Description</th><th>Time Spent</th><th>Status</th></tr>`;
  if (VIEW === 'client') {
    rows.forEach((r,i) => h += rowHtml(r, i+1, showClient));
  } else {
    const g = {};
    rows.forEach(r => (g[r.staff || '—'] = g[r.staff || '—'] || []).push(r));
    Object.keys(g).sort().forEach(s => {
      const list = g[s], m = list.reduce((a,r) => a + r.mins, 0);
      h += `<tr class="grp"><td colspan="${cols}">${esc(s)} — ${list.length} item${list.length===1?'':'s'}, ${fmtMins(m)}</td></tr>`;
      list.forEach((r,i) => h += rowHtml(r, i+1, showClient));
    });
  }
  t.innerHTML = h;
}

function renderSumm(rows){
  const g = {};
  rows.forEach(r => {
    const k = r.staff || '—';
    g[k] = g[k] || {n:0, d:0, m:0};
    g[k].n++; g[k].m += r.mins;
    if (statusInfo(r.status)[2]) g[k].d++;
  });
  const keys = Object.keys(g).sort();
  if (!keys.length){ $('summTbl').innerHTML = '<tr><td class="msg">No records found for the selected filters.</td></tr>'; return; }
  let h = '<tr><th>#</th><th>Employee</th><th>Total Items</th><th>Completed</th><th>Pending</th><th>Time Spent</th></tr>';
  let T = {n:0,d:0,m:0};
  keys.forEach((k,i) => {
    const x = g[k]; T.n += x.n; T.d += x.d; T.m += x.m;
    h += `<tr><td>${i+1}</td><td>${esc(k)}</td><td>${x.n}</td><td>${x.d}</td><td>${x.n-x.d}</td><td>${fmtMins(x.m)}</td></tr>`;
  });
  h += `<tr class="tot"><td></td><td>Total</td><td>${T.n}</td><td>${T.d}</td><td>${T.n-T.d}</td><td>${fmtMins(T.m)}</td></tr>`;
  $('summTbl').innerHTML = h;
}

// ===== Searchable client dropdown =====
const box = $('clientBox'), list = $('clientList');
let hlIndex = -1, visible = [];

function showList(filterText){
  const q = (filterText || '').trim().toLowerCase();
  visible = [''].concat(CLIENTS).filter(c => c === '' ? (!q || 'all clients'.includes(q)) : c.toLowerCase().includes(q));
  hlIndex = -1;
  if (!visible.length){
    list.innerHTML = '<div class="none">No matching client</div>';
  } else {
    list.innerHTML = visible.map((c,i) =>
      `<div data-i="${i}" class="${c === CLIENT ? 'sel' : ''}">${c === '' ? 'All Clients' : esc(c)}</div>`).join('');
  }
  list.classList.remove('hide');
}
function hideList(){
  list.classList.add('hide');
  box.value = CLIENT || 'All Clients';
}
function chooseClient(c){
  CLIENT = c;
  hideList();
  box.blur();
  loadData();
}
function moveHl(d){
  const items = list.querySelectorAll('div[data-i]');
  if (!items.length) return;
  hlIndex = (hlIndex + d + items.length) % items.length;
  items.forEach(x => x.classList.remove('hl'));
  items[hlIndex].classList.add('hl');
  items[hlIndex].scrollIntoView({block:'nearest'});
}

box.addEventListener('focus', () => { box.select(); showList(''); });
box.addEventListener('click', () => { if (list.classList.contains('hide')) { box.select(); showList(''); } });
box.addEventListener('input', () => showList(box.value));
box.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); moveHl(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); moveHl(-1); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    if (visible.length) chooseClient(visible[hlIndex >= 0 ? hlIndex : 0]);
  }
  else if (e.key === 'Escape'){ hideList(); box.blur(); }
});
list.addEventListener('mousedown', e => {
  const el = e.target.closest('div[data-i]');
  if (!el) return;
  e.preventDefault();
  chooseClient(visible[+el.dataset.i]);
});
box.addEventListener('blur', hideList);

// ===== Other events =====
$('emp').addEventListener('change', render);
$('apply').addEventListener('click', loadData);
document.querySelectorAll('input[name="view"]').forEach(b => b.addEventListener('change', () => {
  VIEW = b.value; render();
}));
document.querySelectorAll('input[name="tab"]').forEach(b => b.addEventListener('change', () => {
  TAB = b.value;
  $('histBox').classList.toggle('hide', TAB !== 'hist');
  $('summBox').classList.toggle('hide', TAB !== 'summ');
}));

(async function(){
  setDefaultDates();
  box.value = 'All Clients';
  try { await loadMeta(); } catch(e){ setMsg('Unable to load client and employee lists: ' + e.message); return; }
  loadData();
})();
</script>
</body>
</html>
