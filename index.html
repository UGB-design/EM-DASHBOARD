<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIS Scores</title>
<style>
:root{
  --teal-dark:#0f6b73;
  --teal:#14919b;
  --teal-light:#17a2ad;
  --teal-header:#1aa7b0;
}
</style>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1220;display:flex;align-items:center;justify-content:center;overflow:hidden}

.frame{width:100%;max-width:1150px;background:#fff;border-radius:0;overflow:hidden;box-shadow:0 0 0 rgba(0,0,0,0)}

.firm-header{background:var(--teal-header);padding:16px 24px;display:flex;align-items:center;gap:14px}
.firm-logo{width:44px;height:44px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.firm-logo img{width:100%;height:100%;object-fit:contain}
.firm-name{color:#fff;font-size:22px;font-weight:800;text-decoration:underline;text-underline-offset:4px;letter-spacing:.01em}

.mis-strip{background:var(--teal-light);padding:9px 24px;text-align:center}
.mis-strip span{color:#fff;font-size:17px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

.date-row{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 24px 8px;background:#fff}
.date-label{font-size:19px;font-weight:800;color:#1a1a1a}
.date-box{border:2px solid var(--teal);border-radius:10px;padding:6px 22px;text-align:center;min-width:140px}
.date-box .tag{font-size:10px;color:#9aa0ac;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.date-box .val{font-size:17px;font-weight:800;color:#1a1a1a;margin-top:2px}
  .mode-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px 0;background:#fff}
.mode-btn{border:2px solid var(--teal);background:#fff;color:var(--teal-dark);font-weight:700;font-size:13px;padding:7px 18px;border-radius:20px;cursor:pointer;transition:.2s}
.mode-btn.active{background:var(--teal);color:#fff}
.custom-date-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px 0;background:#fff}
.custom-date-row input[type="date"]{border:2px solid var(--teal);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;color:#1a1a1a}
.custom-date-row button{border:none;background:var(--teal-dark);color:#fff;font-weight:700;font-size:13px;padding:8px 18px;border-radius:8px;cursor:pointer}

.section-title{text-align:center;padding:14px 0 18px;background:#fff}
.section-title span{font-size:19px;font-weight:800;color:var(--teal-dark);text-decoration:underline;text-underline-offset:3px}
.card-wrap{background:#fff;padding:0 32px 26px;display:flex;justify-content:center;max-width:1000px;margin:0 auto}
.emp-card{background:#f4faf9;border-radius:10px;padding:22px 26px;display:flex;gap:26px;align-items:flex-start;width:100%;max-width:900px;transition:opacity .4s ease}
.emp-card.fading{opacity:0}

.emp-photo{width:150px;height:170px;border-radius:8px;border:3px solid var(--teal);overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#0b1437 0%,#1e3a6d 100%);display:flex;align-items:center;justify-content:center}
.emp-photo img{width:100%;height:100%;object-fit:cover}
.emp-photo .initials{color:#fff;font-size:44px;font-weight:800}

.emp-info{flex:1;min-width:0}
.emp-name{font-size:24px;font-weight:800;color:#1a1a1a;line-height:1.2}
.emp-desig{font-size:13px;color:#8a8478;margin-top:2px;margin-bottom:14px}

.stat-table{width:100%;border-collapse:collapse;border-radius:6px;overflow:hidden}
.stat-table tr td{padding:9px 16px;font-size:14px;border-bottom:2px solid #fff}
.stat-table tr td:first-child{background:var(--teal-dark);color:#fff;font-weight:700;width:60%}
.stat-table tr td:last-child{background:#eaf5f4;font-weight:800;text-align:right}
.val-neutral{color:#1a1a1a}
.val-green{color:#16a34a}
.val-blue{color:#2563eb}
.val-red{color:#dc2626}

.bottom-bar{height:10px;background:var(--teal-light)}

.loading{text-align:center;padding:60px;color:#9aa0ac;font-size:14px}
.error{text-align:center;padding:40px 20px;color:#dc2626;font-size:13px;line-height:1.6;word-break:break-word}
</style>

<div class="frame">
  <div class="firm-header">
    <div class="firm-logo" id="firmLogoBox"></div>
    <div class="firm-name" id="firmNameText">Your Firm Name</div>
  </div>

  <div class="mis-strip"><span>MIS Scores</span></div>

    <div class="date-row">
    <div class="date-label">Date :</div>
    <div class="date-box"><div class="tag">From</div><div class="val" id="dateFrom">—</div></div>
    <div class="date-box"><div class="tag">UpTo</div><div class="val" id="dateTo">—</div></div>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="btnLive">Live (Last Week)</button>
    <button class="mode-btn" id="btnCustom">Custom Range</button>
  </div>

  <div class="custom-date-row" id="customDateRow" style="display:none">
    <input type="date" id="customFrom">
    <input type="date" id="customTo">
    <button id="btnApply">Apply</button>
  </div>

  <div class="section-title"><span>Employee Task Report</span></div>
  <div class="card-wrap">
    <div class="emp-card" id="empCard">
      <div class="loading">Loading employee data…</div>
    </div>
  </div>

  <div class="bottom-bar"></div>
</div>

<script>
/* ============================================================
   CONFIG — edit only this block
   ============================================================ */
var API_URL       = 'https://script.google.com/macros/s/AKfycbznU1mdbmjnTIEnsOxKd4cwAN2CvaCoeFqCUCxRY4vlHZ_89oVd7Kt_ZFbXcG8qVrA/exec';   // .../exec URL of the EM DASHBOARD Code.gs deployment
var INTERNAL_KEY  = 'ugb-warm-9273-secret';        // must match INTERNAL_WARM_KEY in Code.gs
var FIRM_NAME     = 'UMESH BOLMAL & ASSOCIATES';
var FIRM_LOGO_URL = 'https://lh3.googleusercontent.com/d/158_HBHOHewJ0wG2BY3ZiBdT_uD7eoDQX=w200';
var ROTATE_MS     = 8000;         // how many milliseconds each employee is shown
var REFRESH_MS    = 120000;       // how often fresh data is pulled from the sheet
/* ============================================================ */

document.getElementById('firmNameText').textContent = FIRM_NAME;
if (FIRM_LOGO_URL) {
  document.getElementById('firmLogoBox').innerHTML = '<img src="' + FIRM_LOGO_URL + '">';
}

var scoresData = [];
var staffByName = {};
var idx = 0;
var currentMode = 'live';      // 'live' ya 'custom'
var customRange = null;        // Apply dabane par set hoga

function ini(n){ var p=String(n).trim().split(' '); return p.length>=2 ? (p[0][0]+p[1][0]).toUpperCase() : String(n).substring(0,2).toUpperCase(); }

function pctNum(raw){
  var s = String(raw||'').trim();
  return parseFloat(s.replace('%','')) || 0;
}
function pctDisplay(raw){
  var n = pctNum(raw);
  return (n===0?'0.00':n.toFixed(2)) + '%';
}

/* dd/MM/yyyy — the format Code.gs's parseDateString() expects */
function toBackendDate(d){
  var dd = ('0' + d.getDate()).slice(-2);
  var mm = ('0' + (d.getMonth()+1)).slice(-2);
  return dd + '/' + mm + '/' + d.getFullYear();
}

/* dd Mon yyyy — for the on-screen From/UpTo boxes */
function toDisplayDate(d){
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

/* LAST week = Monday to Sunday, the week BEFORE the current one */
function getLastWeekRange(){
  var now = new Date();
  var day = now.getDay();                     // 0=Sun ... 6=Sat
  var diffToMonday = (day === 0) ? 6 : day - 1;
  var thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);

  var lastMonday = new Date(thisMonday);
  lastMonday.setDate(thisMonday.getDate() - 7);
  var lastSunday = new Date(lastMonday);
  lastSunday.setDate(lastMonday.getDate() + 6);

  return { from: lastMonday, to: lastSunday };
}

function setWeekDates(range){
  document.getElementById('dateFrom').textContent = toDisplayDate(range.from);
  document.getElementById('dateTo').textContent = toDisplayDate(range.to);
}

function showError(msg){
  var wrap = document.getElementById('empCard');
  wrap.innerHTML = '<div class="error">⚠ Unable to load data.<br>' + msg + '<br><br>Please check the browser console (F12) for full error details.</div>';
}
function loadScores(){
  if (!API_URL || API_URL.indexOf('PASTE_YOUR_EXEC_URL_HERE') !== -1) {
       showError('API URL is not configured — please set your .../exec URL at the top of the script.');
    return;
  }

   if (currentMode === 'custom' && !customRange) return;

  var range = (currentMode === 'custom') ? customRange : getLastWeekRange();
  setWeekDates(range);

  var url = API_URL
    + '?action=getData'
    + '&from=' + encodeURIComponent(toBackendDate(range.from))
    + '&to=' + encodeURIComponent(toBackendDate(range.to))
    + '&internalKey=' + encodeURIComponent(INTERNAL_KEY)
    + '&cb=' + Date.now();

  fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status + ' from Apps Script URL');
      return r.json();
    })
    .then(function(data){
      if (data.authorized === false) {
               showError('Authorization failed — the INTERNAL_KEY does not match the INTERNAL_WARM_KEY in Code.gs.');
        return;
      }
      if (data.error) {
        console.error('Backend error', data);
        showError('Backend error: ' + data.error);
        return;
      }

      // Build name -> {designation, photoUrl} lookup from staffData
      staffByName = {};
      (data.staffData || []).forEach(function(s){
        if (s.name) staffByName[s.name.trim().toUpperCase()] = s;
      });

      scoresData = (data.scoresData || []).filter(function(r){ return r.employee; });
      if (idx >= scoresData.length) idx = 0;
      renderCard();
    })
    .catch(function(err){
      console.error('Fetch failed:', err);
      showError(err.message + ' — please verify: deployment access is set to "Anyone", the URL is correct, and no CORS issue is blocking the request.');
    });
}

function renderCard(){
  var wrap = document.getElementById('empCard');

  if(!scoresData.length){
    wrap.innerHTML = '<div class="loading">No task data available for the selected period.</div>';
    return;
  }

  var r = scoresData[idx];
  var staff = staffByName[String(r.employee).trim().toUpperCase()] || {};
  var plan = Number(r.totalPlan) || 0;
  var done = Number(r.totalCompleted) || 0;
  var onTime = Number(r.onTimeCompleted) || 0;
  var pending = Math.max(0, plan - done);
  var pctCompletion = pctNum(r.workNotDonePct);

  var photoHtml = staff.photoUrl
    ? '<img src="' + staff.photoUrl + '">'
    : '<div class="initials">' + ini(r.employee) + '</div>';

  wrap.innerHTML =
    '<div class="emp-photo">' + photoHtml + '</div>' +
    '<div class="emp-info">' +
      '<div class="emp-name">' + r.employee + '</div>' +
      '<div class="emp-desig">' + (staff.designation || '') + '</div>' +
      '<table class="stat-table">' +
        '<tr><td>Task Allocated</td><td class="val-neutral">' + plan + '</td></tr>' +
        '<tr><td>Task Completed</td><td class="val-green">' + done + '</td></tr>' +
        '<tr><td>Task Completed On Time</td><td class="val-blue">' + onTime + '</td></tr>' +
        '<tr><td>Task Pending</td><td class="val-red">' + pending + '</td></tr>' +
        '<tr><td>% Task Completion</td><td class="' + (pctCompletion<0?'val-red':'val-green') + '">' + pctDisplay(r.workNotDonePct) + '</td></tr>' +
        '<tr><td>% Completion On Time</td><td class="val-blue">' + pctDisplay(r.workNotDoneOnTimePct) + '</td></tr>' +
      '</table>' +
    '</div>';
}

function nextEmployee(){
  if(!scoresData.length) return;
  var wrap = document.getElementById('empCard');
  wrap.classList.add('fading');
  setTimeout(function(){
    idx = (idx + 1) % scoresData.length;
    renderCard();
    wrap.classList.remove('fading');
  }, 400);
}

var btnLive = document.getElementById('btnLive');
var btnCustom = document.getElementById('btnCustom');
var customDateRow = document.getElementById('customDateRow');
var btnApply = document.getElementById('btnApply');

btnLive.addEventListener('click', function(){
  currentMode = 'live';
  btnLive.classList.add('active');
  btnCustom.classList.remove('active');
  customDateRow.style.display = 'none';
  loadScores();
});

btnCustom.addEventListener('click', function(){
  currentMode = 'custom';
  btnCustom.classList.add('active');
  btnLive.classList.remove('active');
  customDateRow.style.display = 'flex';
});

btnApply.addEventListener('click', function(){
  var fromVal = document.getElementById('customFrom').value;
  var toVal   = document.getElementById('customTo').value;
  if(!fromVal || !toVal){
    alert('Please select both From and To dates.');
    return;
  }
  var f = fromVal.split('-'), t = toVal.split('-');
  customRange = {
    from: new Date(f[0], f[1]-1, f[2]),
    to:   new Date(t[0], t[1]-1, t[2])
  };
  loadScores();
});

loadScores();
setInterval(loadScores, REFRESH_MS);
setInterval(nextEmployee, ROTATE_MS);
</script>

</body>
</html>
